<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">📚 BookStore</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Categories</a>
            <a href="#" class="cart-btn">Cart (0)</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Discover Your Next Favorite Book</h1>
        <p>Explore thousands of books across all genres with ease.</p>
        <div class="search-box">
            <input type="text" placeholder="Search by title, author, or keyword...">
            <button>Search</button>
        </div>
    </section>

    <!-- Books Grid Section -->
    <main class="container">
        <h2>Featured Books</h2>
        <div class="book-grid">
            <!-- Sample Book Card 1 -->
            <div class="book-card">
                <div class="book-img-placeholder">Cover Image</div>
                <h3>Atomic Habits</h3>
                <p class="author">by James Clear</p>
                <p class="price">₹499</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <!-- Sample Book Card 2 -->
            <div class="book-card">
                <div class="book-img-placeholder">Cover Image</div>
                <h3>Rich Dad Poor Dad</h3>
                <p class="author">by Robert Kiyosaki</p>
                <p class="price">₹399</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </main>

</body>
</html>
